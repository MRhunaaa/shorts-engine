<title>Detailed Rig Cast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { --bg: #efe9df; --ink: #1a1418; color-scheme: light; }
body { background: var(--bg); margin: 0; font-family: "Fredoka", system-ui, sans-serif; }
h1 { font-size: 40px; margin: 22px 26px 0; color: var(--ink); font-weight: 700; }
.sheet { display: grid; grid-template-columns: repeat(3, 460px); gap: 18px; padding: 22px 26px; width: max-content; }
canvas { width: 460px; height: 700px; border-radius: 20px; display: block; }
</style>
<h1 id="ttl">Detailed outfits · same rig</h1>
<div class="sheet" id="sheet"></div>
<script>
// Same rig as the user's sketch (circle head, tall rounded body, stick limbs), reference-video look, now with heavy outfit detail:
// fabric weave, folds, double stitching, pockets, holed buttons, engraved metal, fur tufts, beard strands, cast shadows, rim light.
const INK = "#1a1418", OW = 7, HEAD = "#f7f1e8";
const P = (c) => { c.lineJoin = "round"; c.lineCap = "round"; return c; };
function E(c, x, y, rx, ry, fill, w = OW, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.5, rx), Math.max(0.5, ry), rot, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (w) { c.lineWidth = w; c.strokeStyle = INK; c.stroke(); } }
function poly(c, pts, fill, w = OW) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } if (w) { c.lineWidth = w; c.strokeStyle = INK; c.stroke(); } }
function L(c, pts, w = OW, col = INK, dash) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.lineWidth = w; c.strokeStyle = col; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); }
function Q(c, a, k, b, w = OW, col = INK, dash) { c.beginPath(); c.moveTo(...a); c.quadraticCurveTo(...k, ...b); c.lineWidth = w; c.strokeStyle = col; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); }
function hex(h, k) { const n = parseInt(h.slice(1), 16); const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f((n >> 16) & 255)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function vgrad(c, y0, y1, base) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, hex(base, 1.12)); g.addColorStop(0.55, base); g.addColorStop(1, hex(base, 0.76)); return g; }
const rnd = (s) => { let x = s; return () => (x = (x * 16807) % 2147483647) / 2147483647; };

// ---------- detail helpers ----------
/** fine diagonal weave inside the current clip */
function weave(c, x0, y0, w, h, col = "rgba(0,0,0,0.07)", step = 6) { c.save(); c.strokeStyle = col; c.lineWidth = 1.2; for (let k = -h; k < w; k += step) { c.beginPath(); c.moveTo(x0 + k, y0); c.lineTo(x0 + k + h, y0 + h); c.stroke(); } c.restore(); }
/** soft fold: dark curve + light curve beside it */
function fold(c, a, k, b, dark = "rgba(0,0,0,0.22)", light = "rgba(255,255,255,0.28)") { Q(c, a, k, b, 3, dark); Q(c, [a[0] + 3, a[1]], [k[0] + 3, k[1]], [b[0] + 3, b[1]], 2, light); }
const stitch = (c, pts, col = "rgba(255,255,255,0.55)") => L(c, pts, 1.8, col, [4, 4]);
function stitchQ(c, a, k, b, col = "rgba(255,255,255,0.55)") { Q(c, a, k, b, 1.8, col, [4, 4]); }
/** 4-hole button */
function button(c, x, y, col = "#e8c45a", r = 5.5) { E(c, x, y, r, r, col, 2.5); for (const [dx, dy] of [[-1.6, -1.6], [1.6, -1.6], [-1.6, 1.6], [1.6, 1.6]]) E(c, x + dx, y + dy, 0.9, 0.9, INK, 0); E(c, x - r * 0.35, y - r * 0.4, r * 0.25, r * 0.18, "rgba(255,255,255,0.7)", 0); }
/** metal plate with bevel + engraving lines */
function metal(c, x, y, w, h, base = "#d9b44a") { rr(c, x, y, w, h, 4); const g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, hex(base, 1.25)); g.addColorStop(0.5, base); g.addColorStop(1, hex(base, 0.7)); c.fillStyle = g; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); rr(c, x + 3, y + 3, w - 6, h - 6, 2); c.lineWidth = 1.2; c.strokeStyle = "rgba(0,0,0,0.35)"; c.stroke(); L(c, [[x + 5, y + 4], [x + w * 0.45, y + 4]], 1.5, "rgba(255,255,255,0.8)"); }
/** fluffy fur band along a horizontal span */
function furBand(c, x0, x1, y, h, col = "#f6f3ee") { const r = rnd(Math.round(x0 * 7 + y)); c.beginPath(); c.moveTo(x0, y + h / 2); for (let x = x0; x <= x1; x += 9) c.quadraticCurveTo(x + 4.5, y - 4 - r() * 4, x + 9, y + (r() - 0.5) * 3); for (let x = x1; x >= x0; x -= 9) c.quadraticCurveTo(x - 4.5, y + h + 4 + r() * 4, x - 9, y + h + (r() - 0.5) * 3); c.closePath(); const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, "#ffffff"); g.addColorStop(1, hex(col, 0.85)); c.fillStyle = g; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke(); for (let k = 0; k < (x1 - x0) / 7; k++) { const x = x0 + 4 + r() * (x1 - x0 - 8), yy = y + 3 + r() * (h - 6); Q(c, [x, yy], [x + 2, yy - 3], [x + 4, yy], 1.3, "rgba(0,0,0,0.18)"); } }
/** pocket with flap and stitching */
function pocket(c, x, y, w, h, col) { rr(c, x, y, w, h, 4); c.fillStyle = hex(col, 0.95); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); stitch(c, [[x + 3, y + 4], [x + 3, y + h - 3], [x + w - 3, y + h - 3], [x + w - 3, y + 4]], "rgba(0,0,0,0.25)"); poly(c, [[x - 2, y - 2], [x + w + 2, y - 2], [x + w + 2, y + 9], [x + w / 2, y + 14], [x - 2, y + 9]], hex(col, 1.05), 3); }
/** rim light on the right edge + soft AO on the left of a rounded rect */
function bodyLight(c, x, y, w, h) { const g = c.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, "rgba(255,255,255,0.20)"); g.addColorStop(0.3, "rgba(255,255,255,0)"); g.addColorStop(0.75, "rgba(0,0,0,0)"); g.addColorStop(0.93, "rgba(0,0,0,0.22)"); g.addColorStop(1, "rgba(150,200,255,0.35)"); c.fillStyle = g; c.fillRect(x, y, w, h); }

// ---------- rig ----------
const CX = 230, HY = 210, HR = 92;
const BW = 136, BH = 200, BX = CX - BW / 2, BY = 296, BR = 44;
const LEG_Y0 = BY + BH - 8, LEG_Y1 = 640;
function legs(c, col, shoe = INK, stripes) {
  for (const s of [-1, 1]) {
    const a = [CX + s * 28, LEG_Y0], b = [CX + s * 31, LEG_Y1];
    L(c, [a, b], 9); if (col) L(c, [a, b], 5, col);
    if (stripes) for (let k = 0; k < 6; k++) L(c, [[a[0] + (b[0] - a[0]) * (k / 6 + 0.04), a[1] + (b[1] - a[1]) * (k / 6 + 0.04)], [a[0] + (b[0] - a[0]) * (k / 6 + 0.1), a[1] + (b[1] - a[1]) * (k / 6 + 0.1)]], 5, stripes);
    // shoe: rounded toe, sole, lace dots, shine
    c.beginPath(); c.moveTo(b[0] - s * 8, b[1] - 8); c.quadraticCurveTo(b[0] + s * 34, b[1] - 12, b[0] + s * 30, b[1] + 6); c.quadraticCurveTo(b[0] + s * 6, b[1] + 12, b[0] - s * 12, b[1] + 6); c.closePath();
    c.fillStyle = shoe; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
    L(c, [[b[0] - s * 12, b[1] + 5], [b[0] + s * 28, b[1] + 5]], 3, "rgba(255,255,255,0.25)");
    E(c, b[0] + s * 16, b[1] - 6, 5, 2.5, "rgba(255,255,255,0.45)", 0);
  }
}
function arms(c, pose = "hang", sleeve) {
  for (const s of [-1, 1]) {
    const sh = [CX + s * 62, BY + 40];
    const pts = pose === "hips" ? [sh, [CX + s * 108, BY + 84], [CX + s * 72, BY + 120]] : [sh, [CX + s * 92, BY + 94], [CX + s * 94, BY + 156]];
    L(c, pts, 8); if (sleeve) { L(c, [pts[0], pts[1]], 4, sleeve); }
    E(c, pts[2][0], pts[2][1], 11, 11, INK, 0); E(c, pts[2][0] - 3, pts[2][1] - 3, 3.5, 3.5, "rgba(255,255,255,0.55)", 0);
  }
}
function bodyShape(c, base, details) {
  rr(c, BX, BY, BW, BH, BR); c.fillStyle = vgrad(c, BY, BY + BH, base); c.fill();
  c.save(); rr(c, BX, BY, BW, BH, BR); c.clip();
  weave(c, BX, BY, BW, BH);
  if (details) details(c);
  bodyLight(c, BX, BY, BW, BH);
  E(c, CX, BY - 6, 70, 26, "rgba(0,0,0,0.22)", 0); // the head's cast shadow on the chest
  c.restore();
  rr(c, BX, BY, BW, BH, BR); c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
}
function head(c, o = {}) {
  const { brow = INK, eyes = "calm", behind, over, face, hatShadow } = o;
  if (behind) behind(c);
  const g = c.createRadialGradient(CX - 30, HY - 34, 12, CX, HY, HR * 1.1); g.addColorStop(0, "#ffffff"); g.addColorStop(0.68, HEAD); g.addColorStop(1, "#ddd0bf");
  E(c, CX, HY, HR, HR, g);
  c.save(); c.beginPath(); c.arc(CX, HY, HR - 3, 0, 7); c.clip();
  if (hatShadow) { const sg = c.createLinearGradient(0, HY - HR, 0, HY - HR + hatShadow); sg.addColorStop(0, "rgba(60,40,30,0.45)"); sg.addColorStop(1, "rgba(60,40,30,0)"); c.fillStyle = sg; c.fillRect(CX - HR, HY - HR, HR * 2, hatShadow); }
  const rim = c.createLinearGradient(CX + HR - 22, 0, CX + HR, 0); rim.addColorStop(0, "rgba(150,200,255,0)"); rim.addColorStop(1, "rgba(150,200,255,0.45)"); c.fillStyle = rim; c.fillRect(CX, HY - HR, HR, HR * 2);
  c.restore();
  for (const s of [-1, 1]) {
    const ex = CX + s * 31, ey = HY + 4;
    E(c, ex, ey, 8.5, 12, INK, 0); E(c, ex - 2.5, ey - 4, 2.6, 3.2, "#ffffff", 0);
    const by = HY - 28;
    if (eyes === "stern") L(c, [[ex - 18, by + (s < 0 ? -3 : 8)], [ex + 18, by + (s < 0 ? 8 : -3)]], 9, brow);
    else Q(c, [ex - 18, by + 5], [ex, by - 5], [ex + 18, by + 5], 9, brow);
  }
  if (face) face(c); else { Q(c, [CX - 18, HY + 40], [CX, HY + 53], [CX + 18, HY + 40], 6); }
  if (over) over(c);
}
function moustache(c, y, col = "#2a1b14", w = 40) {
  c.beginPath(); c.moveTo(CX, y); c.quadraticCurveTo(CX - w * 0.6, y - 12, CX - w, y + 8); c.quadraticCurveTo(CX - w * 0.5, y + 16, CX, y + 8); c.quadraticCurveTo(CX + w * 0.5, y + 16, CX + w, y + 8); c.quadraticCurveTo(CX + w * 0.6, y - 12, CX, y); c.closePath();
  c.fillStyle = col; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
  for (let k = -3; k <= 3; k++) if (k) Q(c, [CX + k * w * 0.22, y + 2], [CX + k * w * 0.26, y + 7], [CX + k * w * 0.3, y + 10], 1.4, "rgba(255,255,255,0.25)");
}
function card(c, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, top); g.addColorStop(1, bottom); c.fillStyle = g; c.fillRect(0, 0, 460, 700);
  const r = c.createRadialGradient(190, 190, 10, 230, 280, 420); r.addColorStop(0, "rgba(255,244,222,0.6)"); r.addColorStop(1, "rgba(255,244,222,0)"); c.fillStyle = r; c.fillRect(0, 0, 460, 700);
  E(c, CX, 654, 96, 13, "rgba(26,20,24,0.2)", 0);
}
function label(c, name, line) { c.fillStyle = INK; c.font = "700 32px Fredoka"; c.textAlign = "left"; c.fillText(name, 22, 44); c.font = "500 15px Fredoka"; c.fillStyle = "rgba(26,20,24,0.62)"; c.fillText(line, 22, 66); }

// ---------- characters ----------
const CAST = [
  { name: "Cowboy", line: "felt hat · straw · leather vest · star badge · gun belt", bg: ["#f6e8cf", "#e6cca2"],
    draw(c) { legs(c, "#6b5038", "#5a3b22"); arms(c, "hips", "#3fa79a");
      bodyShape(c, "#3fa79a", (c) => {
        // shirt: plaid lines, pearl snaps, collar
        for (let x = BX; x < BX + BW; x += 14) L(c, [[x, BY], [x, BY + BH]], 2, "rgba(255,255,255,0.12)");
        for (let y = BY; y < BY + BH; y += 14) L(c, [[BX, y], [BX + BW, y]], 2, "rgba(0,0,0,0.08)");
        for (const y of [40, 70, 100]) button(c, CX, BY + y, "#f2eee6", 4);
        poly(c, [[CX - 30, BY - 4], [CX - 4, BY + 26], [CX - 14, BY - 4]], "#3a9a8e", 3); poly(c, [[CX + 30, BY - 4], [CX + 4, BY + 26], [CX + 14, BY - 4]], "#3a9a8e", 3);
        // leather vest panels with seams, wear marks
        for (const s of [-1, 1]) {
          poly(c, [[CX + s * 10, BY - 6], [CX + s * 80, BY - 6], [CX + s * 80, BY + BH + 6], [CX + s * 26, BY + BH + 6], [CX + s * 20, BY + 70]], vgrad(c, BY, BY + BH, "#8a5a34"), 4);
          stitch(c, [[CX + s * 17, BY + 4], [CX + s * 27, BY + 70], [CX + s * 32, BY + BH]], "rgba(255,230,190,0.6)");
          fold(c, [CX + s * 50, BY + 30], [CX + s * 44, BY + 90], [CX + s * 54, BY + 150]);
          for (let k = 0; k < 4; k++) E(c, CX + s * (40 + k * 7), BY + 120 + k * 9, 3, 1.5, "rgba(255,220,180,0.25)", 0);
        }
        pocket(c, CX + 26, BY + 46, 30, 24, "#7a4e2c");
        // star badge
        const sx = CX - 42, sy = BY + 62; const pts = []; for (let k = 0; k < 10; k++) { const r = k % 2 ? 7 : 16, a = -Math.PI / 2 + k * Math.PI / 5; pts.push([sx + r * Math.cos(a), sy + r * Math.sin(a)]); } poly(c, pts, "#f2c84a", 3); E(c, sx, sy, 5, 5, "#d9a42a", 2); E(c, sx - 5, sy - 6, 2.5, 1.5, "rgba(255,255,255,0.8)", 0);
        // gun belt with holes + engraved buckle
        L(c, [[BX, BY + 158], [BX + BW, BY + 158]], 16, "#4a3020"); stitch(c, [[BX, BY + 152], [BX + BW, BY + 152]], "rgba(255,220,180,0.5)"); stitch(c, [[BX, BY + 164], [BX + BW, BY + 164]], "rgba(255,220,180,0.5)");
        for (let k = 0; k < 4; k++) E(c, CX + 30 + k * 10, BY + 158, 2, 2, INK, 0);
        for (let k = 0; k < 6; k++) { rr(c, BX + 6 + k * 9, BY + 150, 6, 15, 2); c.fillStyle = "#d9b44a"; c.fill(); }
        metal(c, CX - 22, BY + 146, 44, 26, "#cfd3d8"); E(c, CX, BY + 159, 8, 6, null, 1.5);
      });
      // holster + revolver grip
      rr(c, CX + 60, BY + 138, 26, 64, 8); c.fillStyle = vgrad(c, BY + 138, BY + 202, "#6b4228"); c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); stitch(c, [[CX + 64, BY + 144], [CX + 64, BY + 196]], "rgba(255,220,180,0.6)");
      rr(c, CX + 64, BY + 116, 16, 28, 5); c.fillStyle = "#e9e2d2"; c.fill(); c.stroke(); for (let k = 0; k < 4; k++) L(c, [[CX + 67, BY + 122 + k * 5], [CX + 77, BY + 122 + k * 5]], 1.2, "rgba(0,0,0,0.3)");
      head(c, { eyes: "stern", hatShadow: 46, face: (c) => { moustache(c, HY + 34); Q(c, [CX + 26, HY + 48], [CX + 44, HY + 54], [CX + 62, HY + 66], 4, "#e8c45a"); Q(c, [CX + 30, HY + 50], [CX + 44, HY + 56], [CX + 58, HY + 64], 1.5, "#b8902a"); for (let k = 0; k < 18; k++) E(c, CX - 30 + (k % 9) * 7.5, HY + 58 + Math.floor(k / 9) * 6, 1.4, 1.4, "rgba(26,20,24,0.45)", 0); },
        over: (c) => {
          // brim with curl + underside shade, crown with pinch dents, band with conchos
          c.beginPath(); c.moveTo(CX - 150, HY - 62); c.quadraticCurveTo(CX - 150, HY - 92, CX - 120, HY - 82); c.quadraticCurveTo(CX, HY - 112, CX + 120, HY - 82); c.quadraticCurveTo(CX + 150, HY - 92, CX + 150, HY - 62); c.quadraticCurveTo(CX, HY - 40, CX - 150, HY - 62);
          c.fillStyle = vgrad(c, HY - 110, HY - 40, "#d9b77c"); c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
          Q(c, [CX - 130, HY - 62], [CX, HY - 50], [CX + 130, HY - 62], 3, "rgba(90,60,30,0.35)");
          stitchQ(c, [CX - 136, HY - 70], [CX, HY - 56], [CX + 136, HY - 70], "rgba(110,70,30,0.45)");
          c.beginPath(); c.moveTo(CX - 66, HY - 72); c.quadraticCurveTo(CX - 72, HY - 156, CX - 30, HY - 152); c.quadraticCurveTo(CX, HY - 132, CX + 30, HY - 152); c.quadraticCurveTo(CX + 72, HY - 156, CX + 66, HY - 72); c.closePath();
          c.fillStyle = vgrad(c, HY - 156, HY - 72, "#e3c48c"); c.fill(); c.stroke();
          Q(c, [CX - 30, HY - 148], [CX - 22, HY - 118], [CX - 26, HY - 96], 3, "rgba(90,60,30,0.35)"); Q(c, [CX + 30, HY - 148], [CX + 22, HY - 118], [CX + 26, HY - 96], 3, "rgba(90,60,30,0.35)");
          E(c, CX - 40, HY - 132, 8, 18, "rgba(255,255,255,0.22)", 0, 0.2);
          L(c, [[CX - 66, HY - 86], [CX + 66, HY - 86]], 12, "#5a3b22"); for (let k = -3; k <= 3; k++) { E(c, CX + k * 18, HY - 86, 4.5, 4.5, "#cfd3d8", 2); }
        } }); } },
  { name: "Santa", line: "velvet suit · fur trim · curly beard · gold buckle", bg: ["#fbe4e2", "#f0bfbb"],
    draw(c) { legs(c, null, "#1d1418"); arms(c, "hang", "#c22a2a");
      bodyShape(c, "#c92b2b", (c) => {
        // velvet sheen bands, folds
        for (let k = 0; k < 5; k++) Q(c, [BX + 10 + k * 26, BY + 20], [BX + 18 + k * 26, BY + 100], [BX + 8 + k * 26, BY + 180], 6, "rgba(255,255,255,0.05)");
        fold(c, [CX - 46, BY + 40], [CX - 52, BY + 100], [CX - 40, BY + 140]); fold(c, [CX + 44, BY + 50], [CX + 50, BY + 110], [CX + 42, BY + 150]);
        furBand(c, CX - 15, CX + 15, BY - 6, BH + 12);
        furBand(c, BX - 10, BX + BW + 10, BY + BH - 30, 34);
        // belt: holes, keeper loop, buckle with engraving + prong
        L(c, [[BX, BY + 128], [BX + BW, BY + 128]], 22, "#1d1418"); L(c, [[BX, BY + 120], [BX + BW, BY + 120]], 2, "rgba(255,255,255,0.18)");
        for (let k = 0; k < 4; k++) E(c, CX + 34 + k * 9, BY + 128, 2.2, 2.2, "#4a4048", 0);
        metal(c, CX - 22, BY + 112, 44, 32, "#f2c84a"); rr(c, CX - 12, BY + 120, 24, 16, 2); c.fillStyle = "#1d1418"; c.fill(); L(c, [[CX - 12, BY + 128], [CX + 6, BY + 128]], 3, "#f2c84a");
        rr(c, CX + 46, BY + 117, 10, 22, 2); c.lineWidth = 3; c.strokeStyle = "#3a3038"; c.stroke();
        for (const y of [40, 74]) button(c, CX, BY + y, "#1d1418", 5);
      });
      // mittens
      for (const s of [-1, 1]) { E(c, CX + s * 94, BY + 156, 14, 13, "#2f6e3a", 4); furBand(c, CX + s * 94 - 14, CX + s * 94 + 14, BY + 138, 10); }
      head(c, { hatShadow: 34, face: () => {}, over: (c) => {
        // beard: layered curls with strands
        const r = rnd(42);
        c.beginPath(); c.moveTo(CX - 84, HY + 4); c.quadraticCurveTo(CX - 96, HY + 142, CX, HY + 160); c.quadraticCurveTo(CX + 96, HY + 142, CX + 84, HY + 4); c.quadraticCurveTo(CX + 52, HY + 52, CX, HY + 54); c.quadraticCurveTo(CX - 52, HY + 52, CX - 84, HY + 4);
        c.fillStyle = vgrad(c, HY, HY + 160, "#fbfaf7"); c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
        for (let k = 0; k < 26; k++) { const x = CX - 70 + r() * 140, y = HY + 60 + r() * 86; c.beginPath(); c.arc(x, y, 6 + r() * 5, Math.PI * 0.1, Math.PI * 0.95); c.lineWidth = 1.8; c.strokeStyle = "rgba(0,0,0,0.16)"; c.stroke(); }
        for (let k = 0; k < 14; k++) { const x = CX - 60 + r() * 120; Q(c, [x, HY + 70 + r() * 20], [x + 4, HY + 110], [x - 2, HY + 140 + r() * 10], 1.2, "rgba(180,180,190,0.5)"); }
        // big moustache + rosy nose + cheeks
