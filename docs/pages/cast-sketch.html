<title>Sketch Rig Cast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { --bg: #efe9df; --ink: #1a1418; color-scheme: light; }
body { background: var(--bg); margin: 0; font-family: "Fredoka", system-ui, sans-serif; }
h1 { font-size: 40px; margin: 22px 26px 0; color: var(--ink); font-weight: 700; }
.sheet { display: grid; grid-template-columns: repeat(6, 340px); gap: 16px; padding: 22px 26px; width: max-content; }
canvas { width: 340px; height: 520px; border-radius: 18px; display: block; }
</style>
<h1>Our rig · round head + tall rounded body · outfits change</h1>
<div class="sheet" id="sheet"></div>
<script>
// Rig from the user's sketch: CIRCLE head, TALL ROUNDED-RECTANGLE body, thin stick arms from the shoulders, thin stick legs.
// Reference-video look: pale cream head, thick near-black outline, small black eyes + heavy brows, gradient-shaded clothes
// with stitch seams, buttons and trims; only outfit / hair / hat / accessories change.
const INK = "#1a1418", OW = 7, HEAD = "#f7f1e8";
const P = (c) => { c.lineJoin = "round"; c.lineCap = "round"; return c; };
function E(c, x, y, rx, ry, fill, w = OW, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.5, rx), Math.max(0.5, ry), rot, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (w) { c.lineWidth = w; c.strokeStyle = INK; c.stroke(); } }
function poly(c, pts, fill, w = OW) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } if (w) { c.lineWidth = w; c.strokeStyle = INK; c.stroke(); } }
function L(c, pts, w = OW, col = INK, dash) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.lineWidth = w; c.strokeStyle = col; c.setLineDash(dash || []); c.stroke(); c.setLineDash([]); }
function Q(c, a, k, b, w = OW, col = INK) { c.beginPath(); c.moveTo(...a); c.quadraticCurveTo(...k, ...b); c.lineWidth = w; c.strokeStyle = col; c.stroke(); }
function hex(h, k) { const n = parseInt(h.slice(1), 16); const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f((n >> 16) & 255)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function vgrad(c, y0, y1, base) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, hex(base, 1.1)); g.addColorStop(0.55, base); g.addColorStop(1, hex(base, 0.78)); return g; }
function hgradShade(c, x0, x1) { const g = c.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, "rgba(255,255,255,0.18)"); g.addColorStop(0.35, "rgba(255,255,255,0)"); g.addColorStop(0.75, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.20)"); return g; }

// ---- rig geometry (canvas 340x520 @1x) ----
const CX = 170, HY = 150, HR = 70;            // head circle
const BX = CX - 52, BY = 214, BW = 104, BH = 150, BR = 34; // tall rounded body
const LEG_Y0 = BY + BH - 6, LEG_Y1 = 470;

function legs(c, col = INK) { for (const s of [-1, 1]) { L(c, [[CX + s * 22, LEG_Y0], [CX + s * 24, LEG_Y1]], 7, col === INK ? INK : INK); if (col !== INK) L(c, [[CX + s * 22, LEG_Y0], [CX + s * 24, LEG_Y1]], 4, col); E(c, CX + s * 30, LEG_Y1 + 4, 13, 7, INK, 0); } }
function arms(c, pose = "hang") {
  for (const s of [-1, 1]) {
    const sh = [CX + s * 48, BY + 30];
    const pts = pose === "hips" ? [sh, [CX + s * 82, BY + 64], [CX + s * 54, BY + 92]] : [sh, [CX + s * 70, BY + 70], [CX + s * 72, BY + 116]];
    L(c, pts, 6); E(c, pts[2][0], pts[2][1], 8, 8, INK, 0); E(c, pts[2][0] - 2, pts[2][1] - 2, 2.5, 2.5, "rgba(255,255,255,0.6)", 0);
  }
}
/** body: tall rounded rect filled with the outfit, then the details clipped inside */
function bodyShape(c, base, details) {
  rr(c, BX, BY, BW, BH, BR); c.fillStyle = vgrad(c, BY, BY + BH, base); c.fill();
  c.save(); rr(c, BX, BY, BW, BH, BR); c.clip(); c.fillStyle = hgradShade(c, BX, BX + BW); c.fillRect(BX, BY, BW, BH);
  if (details) details(c); c.restore();
  rr(c, BX, BY, BW, BH, BR); c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
}
/** head: perfect circle, pale cream with a soft bottom shade, small black eyes, heavy brows */
function head(c, o = {}) {
  const { brow = INK, eyes = "calm", mouth = "smile", behind, over, face } = o;
  if (behind) behind(c);
  const g = c.createRadialGradient(CX - 22, HY - 26, 10, CX, HY, HR * 1.1); g.addColorStop(0, "#ffffff"); g.addColorStop(0.7, HEAD); g.addColorStop(1, "#e2d6c6");
  E(c, CX, HY, HR, HR, g);
  for (const s of [-1, 1]) {
    const ex = CX + s * 24, ey = HY + 2;
    if (eyes === "sleepy") L(c, [[ex - 9, ey], [ex + 9, ey]], 6); else E(c, ex, ey, 6.5, 9, INK, 0);
    const by = HY - 22;
    if (eyes === "stern") L(c, [[ex - 14, by + (s < 0 ? -2 : 6)], [ex + 14, by + (s < 0 ? 6 : -2)]], 7, brow);
    else if (eyes === "sleepy") L(c, [[ex - 13, by + 4], [ex + 13, by + 4]], 7, brow);
    else Q(c, [ex - 14, by + 4], [ex, by - 4], [ex + 14, by + 4], 7, brow);
  }
  if (face) face(c);
  else if (mouth === "smile") Q(c, [CX - 14, HY + 30], [CX, HY + 40], [CX + 14, HY + 30], 5);
  else if (mouth === "flat") L(c, [[CX - 11, HY + 34], [CX + 11, HY + 34]], 5);
  if (over) over(c);
}
function card(c, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, 520); g.addColorStop(0, top); g.addColorStop(1, bottom); c.fillStyle = g; c.fillRect(0, 0, 340, 520);
  const r = c.createRadialGradient(150, 140, 10, 170, 200, 300); r.addColorStop(0, "rgba(255,240,215,0.55)"); r.addColorStop(1, "rgba(255,240,215,0)"); c.fillStyle = r; c.fillRect(0, 0, 340, 520);
  E(c, CX, 482, 74, 10, "rgba(26,20,24,0.18)", 0);
}
function label(c, name, line) { c.fillStyle = INK; c.font = "700 28px Fredoka"; c.textAlign = "left"; c.fillText(name, 18, 38); c.font = "500 14px Fredoka"; c.fillStyle = "rgba(26,20,24,0.6)"; c.fillText(line, 18, 58); }
const stitch = (c, pts, col = "rgba(255,255,255,0.45)") => L(c, pts, 2, col, [5, 5]);
const button = (c, x, y, col = "#e8c45a") => { E(c, x, y, 4.5, 4.5, col, 3); };

// ---- characters ----
const CAST = [
  { name: "BASE", line: "the shared rig: round head, tall body", bg: ["#ece6dc", "#ddd3c4"],
    draw(c) { legs(c); arms(c); bodyShape(c, "#8fc7e6", (c) => { stitch(c, [[CX, BY + 20], [CX, BY + BH]], "rgba(0,0,0,0.18)"); for (const y of [44, 72, 100]) button(c, CX, BY + y, "#ffffff"); poly(c, [[CX - 26, BY - 2], [CX, BY + 22], [CX + 26, BY - 2]], "#ffffff", 4); }); head(c, { over: (c) => { c.save(); c.beginPath(); c.arc(CX, HY, HR - 3, Math.PI * 1.02, Math.PI * 1.98); c.lineTo(CX + HR, HY - 20); c.quadraticCurveTo(CX, HY - 40, CX - HR, HY - 20); c.closePath(); c.fillStyle = "#4a3426"; c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke(); c.restore(); } }); } },
  { name: "Cowboy", line: "hat · moustache · vest · holster", bg: ["#f4e6cc", "#e6cfa6"],
    draw(c) { legs(c, "#5a4430"); arms(c, "hips");
      bodyShape(c, "#3fa79a", (c) => { for (const s of [-1, 1]) { poly(c, [[CX + s * 8, BY - 4], [CX + s * 60, BY - 4], [CX + s * 60, BY + BH + 4], [CX + s * 22, BY + BH + 4]], vgrad(c, BY, BY + BH, "#8a5a34"), 4); stitch(c, [[CX + s * 14, BY + 4], [CX + s * 26, BY + BH]]); } E(c, CX - 30, BY + 52, 9, 9, "#e8c45a", 3); L(c, [[BX, BY + 118], [BX + BW, BY + 118]], 12, "#4a3020"); rr(c, CX - 12, BY + 110, 24, 16, 4); c.fillStyle = "#d9dde2"; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); });
      rr(c, CX + 46, BY + 104, 18, 46, 6); c.fillStyle = "#6b4228"; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); rr(c, CX + 50, BY + 92, 10, 18, 3); c.fillStyle = "#cfd3d8"; c.fill(); c.stroke();
      head(c, { eyes: "stern", face: (c) => { c.beginPath(); c.moveTo(CX, HY + 24); c.quadraticCurveTo(CX - 22, HY + 16, CX - 32, HY + 30); c.quadraticCurveTo(CX - 18, HY + 36, CX, HY + 30); c.quadraticCurveTo(CX + 18, HY + 36, CX + 32, HY + 30); c.quadraticCurveTo(CX + 22, HY + 16, CX, HY + 24); c.fillStyle = "#2a1b14"; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke(); L(c, [[CX + 18, HY + 40], [CX + 44, HY + 50]], 4, "#e8c45a"); },
        over: (c) => { c.beginPath(); c.moveTo(CX - 118, HY - 46); c.quadraticCurveTo(CX, HY - 84, CX + 118, HY - 46); c.quadraticCurveTo(CX, HY - 30, CX - 118, HY - 46); c.fillStyle = vgrad(c, HY - 80, HY - 30, "#d9b77c"); c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
          c.beginPath(); c.moveTo(CX - 52, HY - 52); c.quadraticCurveTo(CX - 56, HY - 118, CX - 22, HY - 116); c.quadraticCurveTo(CX, HY - 100, CX + 22, HY - 116); c.quadraticCurveTo(CX + 56, HY - 118, CX + 52, HY - 52); c.closePath(); c.fillStyle = vgrad(c, HY - 118, HY - 52, "#e3c48c"); c.fill(); c.stroke(); L(c, [[CX - 52, HY - 64], [CX + 52, HY - 64]], 7, "#5a3b22"); } }); } },
  { name: "Santa", line: "pom-pom hat · beard · fur trim · belt", bg: ["#fbe3e1", "#f2c2bf"],
    draw(c) { legs(c); arms(c);
      bodyShape(c, "#d22f2f", (c) => { L(c, [[CX, BY], [CX, BY + BH]], 14, "#f6f3ee"); L(c, [[BX, BY + BH - 6], [BX + BW, BY + BH - 6]], 16, "#f6f3ee"); L(c, [[BX, BY + 104], [BX + BW, BY + 104]], 14, "#1d1418"); rr(c, CX - 14, BY + 95, 28, 18, 4); c.fillStyle = "#f2c84a"; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke(); for (const y of [36, 66]) button(c, CX, BY + y, "#1d1418"); });
      head(c, { over: (c) => { c.beginPath(); c.moveTo(CX - 64, HY + 6); c.quadraticCurveTo(CX - 70, HY + 110, CX, HY + 118); c.quadraticCurveTo(CX + 70, HY + 110, CX + 64, HY + 6); c.quadraticCurveTo(CX + 40, HY + 40, CX, HY + 42); c.quadraticCurveTo(CX - 40, HY + 40, CX - 64, HY + 6); c.fillStyle = vgrad(c, HY, HY + 118, "#fbfaf7"); c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
          c.beginPath(); c.moveTo(CX, HY + 30); c.quadraticCurveTo(CX - 24, HY + 18, CX - 34, HY + 34); c.quadraticCurveTo(CX - 16, HY + 40, CX, HY + 36); c.quadraticCurveTo(CX + 16, HY + 40, CX + 34, HY + 34); c.quadraticCurveTo(CX + 24, HY + 18, CX, HY + 30); c.fillStyle = "#f4f2ee"; c.fill(); c.lineWidth = 4; c.stroke(); E(c, CX, HY + 16, 9, 7, "#f2a6a0", 4);
          c.beginPath(); c.moveTo(CX - 66, HY - 40); c.quadraticCurveTo(CX - 20, HY - 120, CX + 70, HY - 102); c.quadraticCurveTo(CX + 30, HY - 70, CX + 66, HY - 40); c.closePath(); c.fillStyle = vgrad(c, HY - 120, HY - 40, "#d22f2f"); c.fill(); c.stroke(); rr(c, CX - 76, HY - 54, 152, 26, 13); c.fillStyle = "#f6f3ee"; c.fill(); c.stroke(); E(c, CX + 74, HY - 104, 16, 16, "#f6f3ee"); },
        face: (c) => {} }); } },
  { name: "Elf", line: "pointy hat + bell · pointy ears · zigzag collar", bg: ["#e2f2df", "#c3e2bd"],
    draw(c) { legs(c, "#d22f2f"); for (const s of [-1, 1]) for (let k = 0; k < 4; k++) L(c, [[CX + s * 22, LEG_Y0 + 14 + k * 24], [CX + s * 23, LEG_Y0 + 24 + k * 24]], 5, "#f6f3ee"); arms(c);
      bodyShape(c, "#2f9a4f", (c) => { const zz = []; for (let k = 0; k <= 8; k++) zz.push([BX + k * (BW / 8), BY + (k % 2 ? 26 : 8)]); poly(c, [[BX, BY - 4], [BX + BW, BY - 4], ...zz.reverse()], "#d22f2f", 4); L(c, [[BX, BY + 112], [BX + BW, BY + 112]], 12, "#3a2a1e"); rr(c, CX - 11, BY + 104, 22, 16, 3); c.fillStyle = "#f2c84a"; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); for (const y of [50, 78]) button(c, CX, BY + y); });
      head(c, { behind: (c) => { for (const s of [-1, 1]) poly(c, [[CX + s * 60, HY - 6], [CX + s * 104, HY - 34], [CX + s * 66, HY + 22]], HEAD); }, mouth: "smile",
        over: (c) => { c.beginPath(); c.moveTo(CX - 70, HY - 30); c.quadraticCurveTo(CX - 10, HY - 150, CX + 90, HY - 120); c.quadraticCurveTo(CX + 30, HY - 80, CX + 70, HY - 30); c.closePath(); c.fillStyle = vgrad(c, HY - 150, HY - 30, "#2f9a4f"); c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke(); rr(c, CX - 74, HY - 44, 148, 22, 11); c.fillStyle = "#d22f2f"; c.fill(); c.stroke(); E(c, CX + 92, HY - 118, 11, 11, "#f2c84a", 5); L(c, [[CX + 86, HY - 116], [CX + 98, HY - 116]], 3); } }); } },
  { name: "Chef", line: "tall toque · neckerchief · double-breasted", bg: ["#f6efe6", "#e9dccb"],
    draw(c) { legs(c, "#2a2a33"); arms(c);
      bodyShape(c, "#fbfbfa", (c) => { for (const s of [-1, 1]) for (const y of [44, 74, 104]) button(c, CX + s * 20, BY + y, "#1d1418"); stitch(c, [[CX + 32, BY + 20], [CX + 32, BY + BH]], "rgba(0,0,0,0.15)"); rr(c, BX - 4, BY + 120, BW + 8, 40, 0); c.fillStyle = "#e8e2d8"; c.fill(); poly(c, [[CX - 24, BY - 2], [CX, BY + 18], [CX + 24, BY - 2]], "#d22f2f", 4); });
      head(c, { mouth: "smile", over: (c) => { rr(c, CX - 50, HY - 98, 100, 44, 10); c.fillStyle = vgrad(c, HY - 98, HY - 54, "#ffffff"); c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke(); for (const [x, y, r] of [[CX - 34, HY - 112, 26], [CX, HY - 124, 32], [CX + 34, HY - 112, 26]]) E(c, x, y, r, r, "#ffffff"); rr(c, CX - 50, HY - 98, 100, 44, 10); c.fillStyle = "#ffffff"; c.fill(); L(c, [[CX - 50, HY - 98], [CX - 50, HY - 54], [CX + 50, HY - 54], [CX + 50, HY - 98]], OW); for (const x of [-24, 0, 24]) L(c, [[CX + x, HY - 92], [CX + x, HY - 60]], 2, "rgba(0,0,0,0.15)"); } ,
        face: (c) => { Q(c, [CX - 14, HY + 32], [CX, HY + 42], [CX + 14, HY + 32], 5); c.beginPath(); c.moveTo(CX, HY + 22); c.quadraticCurveTo(CX - 20, HY + 14, CX - 30, HY + 26); c.quadraticCurveTo(CX - 16, HY + 30, CX, HY + 27); c.quadraticCurveTo(CX + 16, HY + 30, CX + 30, HY + 26); c.quadraticCurveTo(CX + 20, HY + 14, CX, HY + 22); c.fillStyle = "#2a1b14"; c.fill(); } }); } },
  { name: "Doctor", line: "head mirror · glasses · coat · stethoscope", bg: ["#e2eef6", "#c6dcec"],
    draw(c) { legs(c, "#5b8fd0"); arms(c);
      bodyShape(c, "#fbfbfa", (c) => { rr(c, CX - 24, BY - 4, 48, BH + 8, 8); c.fillStyle = vgrad(c, BY, BY + BH, "#6aa0dc"); c.fill(); for (const s of [-1, 1]) poly(c, [[CX + s * 4, BY - 4], [CX + s * 32, BY + 48], [CX + s * 40, BY - 4]], "#eef0f2", 4); rr(c, CX + 26, BY + 70, 22, 26, 3); c.fillStyle = "#eef0f2"; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); L(c, [[CX + 32, BY + 66], [CX + 34, BY + 80]], 4, "#2f6fb5"); });
      c.beginPath(); c.moveTo(CX - 30, BY + 4); c.quadraticCurveTo(CX - 40, BY + 70, CX - 10, BY + 80); c.moveTo(CX + 30, BY + 4); c.quadraticCurveTo(CX + 22, BY + 60, CX - 10, BY + 80); c.lineWidth = 6; c.strokeStyle = "#3a3f4a"; c.stroke(); E(c, CX - 10, BY + 86, 9, 9, "#c9ced6", 4);
      head(c, { brow: "#5a3b22", mouth: "smile", over: (c) => { for (const s of [-1, 1]) E(c, CX + s * 24, HY + 2, 17, 17, "rgba(220,240,255,0.25)", 5); L(c, [[CX - 7, HY + 2], [CX + 7, HY + 2]], 5); L(c, [[CX - 64, HY - 30], [CX + 64, HY - 30]], 9, "#3a3f4a"); E(c, CX, HY - 40, 18, 18, "#dfe6ee", 5); E(c, CX, HY - 40, 7, 7, "#9fb4c8", 0);
          c.beginPath(); c.arc(CX, HY, HR - 3, Math.PI * 1.08, Math.PI * 1.92); c.lineTo(CX + HR - 14, HY - 30); c.lineTo(CX - HR + 14, HY - 30); c.closePath(); c.fillStyle = "#8a5a3a"; c.fill(); c.lineWidth = OW; c.strokeStyle = INK; c.stroke(); L(c, [[CX - 64, HY - 30], [CX + 64, HY - 30]], 9, "#3a3f4a"); E(c, CX, HY - 40, 18, 18, "#dfe6ee", 5); E(c, CX, HY - 40, 7, 7, "#9fb4c8", 0); } }); } },
];
const sheet = document.getElementById("sheet");
document.fonts.ready.then(() => CAST.forEach((ch) => { const cv = document.createElement("canvas"); cv.width = 680; cv.height = 1040; const c = P(cv.getContext("2d")); c.scale(2, 2); card(c, ch.bg[0], ch.bg[1]); c.save(); c.translate(170, 64); c.scale(0.9, 0.9); c.translate(-170, 0); ch.draw(c); c.restore(); label(c, ch.name, ch.line); sheet.appendChild(cv); }));
</script>
