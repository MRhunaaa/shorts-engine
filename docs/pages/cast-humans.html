<title>Human Host Lineup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { --bg: #f4f1ec; --ink: #241726; color-scheme: light; }
body { background: var(--bg); margin: 0; font-family: "Fredoka", system-ui, sans-serif; }
.sheet { display: grid; grid-template-columns: repeat(5, 360px); gap: 18px; padding: 26px; width: max-content; }
h1 { font-size: 44px; margin: 22px 26px 0; color: var(--ink); font-weight: 700; }
canvas { width: 360px; height: 470px; border-radius: 18px; display: block; }
</style>
<h1 id="ttl">Host lineup · drawn in code</h1>
<div class="sheet" id="sheet"></div>
<script>
const INK = "#241726", OW = 9;
const P = (c) => { c.lineJoin = "round"; c.lineCap = "round"; return c; };
function path(c, fn) { c.beginPath(); fn(); }
function fillInk(c, fill, w = OW) { if (fill) { c.fillStyle = fill; c.fill(); } if (w) { c.lineWidth = w; c.strokeStyle = INK; c.stroke(); } }
function E(c, x, y, rx, ry, fill, w = OW, rot = 0) { path(c, () => c.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), rot, 0, Math.PI * 2)); fillInk(c, fill, w); }
function poly(c, pts, fill, w = OW) { path(c, () => { pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); }); fillInk(c, fill, w); }
function L(c, pts, w = OW, col = INK) { path(c, () => pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)))); c.lineWidth = w; c.strokeStyle = col; c.stroke(); }
function Q(c, a, ctrl, b, w = OW, col = INK) { path(c, () => { c.moveTo(...a); c.quadraticCurveTo(...ctrl, ...b); }); c.lineWidth = w; c.strokeStyle = col; c.stroke(); }
function hex(h, k) { const n = parseInt(h.slice(1), 16); const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f((n >> 16) & 255)},${f((n >> 8) & 255)},${f(n & 255)})`; }
/** soft 3-tone fill: light top-left -> base -> shade bottom-right, plus a gentle sheen */
function shaded(c, x, y, rx, ry, base, rot = 0) {
  const g = c.createLinearGradient(x - rx, y - ry, x + rx * 0.6, y + ry);
  g.addColorStop(0, hex(base, 1.12)); g.addColorStop(0.55, base); g.addColorStop(1, hex(base, 0.8));
  E(c, x, y, rx, ry, g, OW, rot);
  c.save(); c.globalAlpha = 0.22; E(c, x - rx * 0.35, y - ry * 0.42, rx * 0.32, ry * 0.2, "#ffffff", 0, -0.4); c.restore();
}
function shadedPoly(c, pts, base) {
  const ys = pts.map((p) => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, hex(base, 1.1)); g.addColorStop(1, hex(base, 0.82));
  poly(c, pts, g);
}

// ---------- faces ----------
/** eyes: white sclera, pupils, brows. ex: "happy" | "shock" | "smug" */
function eyes(c, x, y, gap, r, ex, o = {}) {
  for (const s of [-1, 1]) {
    const cx = x + s * gap, rr = ex === "shock" ? r * 1.18 : r;
    E(c, cx, y, rr, rr * 1.12, "#ffffff", 6);
    const pr = ex === "shock" ? r * 0.3 : r * 0.46, lk = o.look ?? 0;
    E(c, cx + lk * r * 0.3, y + r * 0.12, pr, pr * 1.1, INK, 0);
    path(c, () => c.arc(cx + lk * r * 0.3 - pr * 0.35, y - pr * 0.25, pr * 0.32, 0, 7)); c.fillStyle = "#fff"; c.fill();
    if (ex === "smug") { c.save(); path(c, () => c.ellipse(cx, y, rr, rr * 1.12, 0, 0, 7)); c.clip(); c.fillStyle = o.lid || "#e9dccb"; c.fillRect(cx - rr - 2, y - rr * 1.2, rr * 2 + 4, rr * 1.15); c.restore(); L(c, [[cx - rr, y - 2], [cx + rr, y - 2]], 6); E(c, cx, y, rr, rr * 1.12, null, 6); }
    const by = y - rr * 1.5;
    if (ex === "shock") Q(c, [cx - r, by - 2], [cx, by - 16], [cx + r, by - 2], 8);
    else if (ex === "smug") L(c, [[cx - r, by + (s < 0 ? -10 : 4)], [cx + r, by + (s < 0 ? -2 : 0)]], 8);
    else Q(c, [cx - r, by + 4], [cx, by - 8], [cx + r, by + 4], 8);
    if (o.glasses) E(c, cx, y, rr * 1.38, rr * 1.38, null, 6);
  }
  if (o.glasses) L(c, [[x - gap + r * 1.38, y - 2], [x + gap - r * 1.38, y - 2]], 6);
}
function mouth(c, x, y, ex, w = 30) {
  if (ex === "shock") { E(c, x, y + 6, w * 0.45, w * 0.6, "#5a1f2e", 7); E(c, x, y + 16, w * 0.3, w * 0.22, "#ff7a8a", 0); }
  else if (ex === "smug") Q(c, [x - w * 0.6, y + 2], [x + w * 0.1, y + 10], [x + w * 0.75, y - 8], 8);
  else { path(c, () => { c.moveTo(x - w, y - 4); c.quadraticCurveTo(x, y + w * 1.25, x + w, y - 4); c.closePath(); }); fillInk(c, "#5a1f2e", 7); E(c, x, y + w * 0.5, w * 0.45, w * 0.22, "#ff7a8a", 0); }
}

// ---------- body ----------
/** tube limb: ink outline + colour core, joint-rounded */
function tube(c, pts, w, col) { L(c, pts, w + 9); L(c, pts, w, col); }
/** mitten hand with a thumb */
function hand(c, x, y, col, s = 1) { E(c, x, y, 15, 14, col, 6); E(c, x - s * 12, y - 8, 7, 9, col, 5, s * 0.6); }
/** cartoon body v2: shoulders + waist torso, tube arms with sleeves, trousers, chunky shoes */
function body(c, o) {
  const { cx = 180, top = 250, shirt, pants = "#3b3f52", shoes = INK, arm = "hang", prop, tail, skin = "#f5c9a0" } = o;
  const sw = 74, ww = 56, h = 116; // half shoulder width, half waist width, torso height
  if (tail) tail(c);
  // legs + shoes
  for (const s of [-1, 1]) {
    tube(c, [[cx + s * 24, top + h - 6], [cx + s * 28, top + h + 64]], 26, pants);
    path(c, () => { c.moveTo(cx + s * 12, top + h + 62); c.quadraticCurveTo(cx + s * 12, top + h + 84, cx + s * 30, top + h + 86); c.quadraticCurveTo(cx + s * 64, top + h + 88, cx + s * 58, top + h + 70); c.quadraticCurveTo(cx + s * 50, top + h + 58, cx + s * 30, top + h + 60); c.closePath(); }); fillInk(c, shoes, 7);
    L(c, [[cx + s * 18, top + h + 80], [cx + s * 56, top + h + 80]], 5, "rgba(255,255,255,0.55)");
  }
  // hips / trousers top
  path(c, () => c.roundRect(cx - ww - 2, top + h - 30, (ww + 2) * 2, 44, 16)); fillInk(c, pants, 8);
  const sh = (s) => [cx + s * (sw - 10), top + 22];
  const hang = (s) => [sh(s), [cx + s * (sw + 12), top + 64], [cx + s * (sw + 4), top + 108]];
  const POSES = {
    hang,
    wave: (s) => (s > 0 ? [sh(s), [cx + sw + 30, top - 2], [cx + sw + 20, top - 58]] : hang(s)),
    hold: (s) => (s > 0 ? [sh(s), [cx + sw + 22, top + 58], [cx + sw - 18, top + 72]] : hang(s)),
    hips: (s) => [sh(s), [cx + s * (sw + 34), top + 52], [cx + s * (ww + 6), top + 86]],
  };
  const A = POSES[arm] || hang;
  // arms (behind torso edges): sleeve on the upper arm + forearm, mitten hand
  for (const s of [-1, 1]) { const p = A(s); tube(c, [p[0], p[1]], 26, o.sleeve || shirt); tube(c, [p[1], p[2]], 22, hex(o.sleeve || shirt, 0.92)); L(c, [p[1], p[1]], 30, INK); L(c, [p[1], p[1]], 21, hex(o.sleeve || shirt, 0.96)); hand(c, p[2][0], p[2][1], skin, s); }
  // torso: rounded trapezoid with gradient + sheen
  const T = [[cx - sw, top + 8], [cx + sw, top + 8], [cx + ww + 4, top + h], [cx - ww - 4, top + h]];
  path(c, () => { c.moveTo(cx - sw + 22, top); c.lineTo(cx + sw - 22, top); c.quadraticCurveTo(cx + sw + 4, top, cx + sw, top + 30); c.lineTo(cx + ww + 6, top + h - 12); c.quadraticCurveTo(cx + ww + 6, top + h, cx + ww - 8, top + h); c.lineTo(cx - ww + 8, top + h); c.quadraticCurveTo(cx - ww - 6, top + h, cx - ww - 6, top + h - 12); c.lineTo(cx - sw, top + 30); c.quadraticCurveTo(cx - sw - 4, top, cx - sw + 22, top); c.closePath(); });
  const g = c.createLinearGradient(cx - sw, top, cx + sw * 0.7, top + h); g.addColorStop(0, hex(shirt, 1.12)); g.addColorStop(0.6, shirt); g.addColorStop(1, hex(shirt, 0.82));
  c.save(); c.fillStyle = g; c.fill(); c.clip();
  c.globalAlpha = 0.18; E(c, cx - sw * 0.45, top + h * 0.3, 22, 40, "#ffffff", 0, -0.25); c.globalAlpha = 1;
  if (o.decor) o.decor(c, cx, top, sw * 2, h);
  c.restore();
  c.lineWidth = OW; c.strokeStyle = INK; c.stroke();
  void T;
  if (prop) prop(c, A(1)[2]);
}
function bodyOld(c, o) {
  const { cx = 180, top = 248, shirt, pants = "#3b3f52", shoes = INK, arm = "hang", prop, tail } = o;
  const w = 118, h = 120;
  if (tail) tail(c);
  for (const s of [-1, 1]) { L(c, [[cx + s * 22, top + h - 14], [cx + s * 26, top + h + 66]], 13); L(c, [[cx + s * 22, top + h - 14], [cx + s * 26, top + h + 66]], 6, hex(pants, 1)); E(c, cx + s * 34, top + h + 72, 19, 10, shoes, 6); }
  const sh = (s) => [cx + s * w * 0.4, top + 26];
  const hang = (s) => [sh(s), [cx + s * w * 0.62, top + 64], [cx + s * w * 0.6, top + 108]];
  const POSES = {
    hang,
    wave: (s) => (s > 0 ? [sh(s), [cx + w * 0.74, top - 4], [cx + w * 0.62, top - 56]] : hang(s)),
    hold: (s) => (s > 0 ? [sh(s), [cx + w * 0.7, top + 60], [cx + w * 0.42, top + 72]] : hang(s)),
    hips: (s) => [sh(s), [cx + s * w * 0.8, top + 48], [cx + s * w * 0.44, top + 86]],
  };
  const A = POSES[arm] || hang;
  for (const s of [-1, 1]) { const p = A(s); L(c, p, 14); L(c, p, 7, hex(o.sleeve || shirt, 0.92)); path(c, () => c.arc(p[2][0], p[2][1], 9, 0, 7)); c.fillStyle = INK; c.fill(); }
  shaded(c, cx, top + h * 0.5, w * 0.5, h * 0.54, shirt);
  if (o.decor) { c.save(); path(c, () => c.ellipse(cx, top + h * 0.5, w * 0.5, h * 0.54, 0, 0, 7)); c.clip(); o.decor(c, cx, top, w, h); c.restore(); E(c, cx, top + h * 0.5, w * 0.5, h * 0.54, null, OW); }
  if (prop) prop(c, A(1)[2]);
}

// ---------- card frame ----------
function card(c, bg1, bg2) {
  const g = c.createLinearGradient(0, 0, 0, 470); g.addColorStop(0, bg1); g.addColorStop(1, bg2); c.fillStyle = g; c.fillRect(0, 0, 360, 470);
  const r = c.createRadialGradient(150, 150, 10, 150, 190, 260); r.addColorStop(0, "rgba(255,255,255,0.55)"); r.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = r; c.fillRect(0, 0, 360, 470);
  E(c, 150, 448, 86, 11, "rgba(36,23,38,0.16)", 0);
}
function label(c, name, line) {
  c.fillStyle = INK; c.font = "700 30px Fredoka"; c.textAlign = "left"; c.fillText(name, 18, 40);
  c.font = "500 15px Fredoka"; c.fillStyle = "rgba(36,23,38,0.62)"; c.fillText(line, 18, 62);
}
/** draw the head small for an expression chip */
function chip(c, x, y, s, head, ex, bg) {
  c.save(); E(c, x, y, 34, 34, bg, 4); path(c, () => c.arc(x, y, 32, 0, 7)); c.clip();
  c.translate(x, y); c.scale(s, s); c.translate(-150, -170); head(c, ex); c.restore();
}

// ---------- human heads (drawn around x=150, y=170) ----------
/** base human head: egg shape, ears, cheeks, nose, eyes, brows, mouth; hair/hat drawn by callbacks */
function humanHead(c, ex, o) {
  const { skin, back, front, eyeOpt = {}, nose = "button", mouthW = 20, extra } = o;
  if (back) back(c);
  for (const s of [-1, 1]) { E(c, 150 + s * 86, 176, 16, 20, skin, 7); E(c, 150 + s * 86, 178, 7, 10, hex(skin, 0.85), 0); }
  const g = c.createLinearGradient(80, 90, 210, 260); g.addColorStop(0, hex(skin, 1.08)); g.addColorStop(0.6, skin); g.addColorStop(1, hex(skin, 0.86));
  path(c, () => { c.moveTo(150, 82); c.bezierCurveTo(232, 82, 246, 180, 226, 222); c.bezierCurveTo(206, 262, 94, 262, 74, 222); c.bezierCurveTo(54, 180, 68, 82, 150, 82); });
  fillInk(c, g);
  c.save(); c.globalAlpha = 0.25; E(c, 112, 132, 24, 14, "#ffffff", 0, -0.4); c.restore();
  E(c, 104, 204, 15, 9, "rgba(255,110,120,0.22)", 0); E(c, 196, 204, 15, 9, "rgba(255,110,120,0.22)", 0);
  eyes(c, 150, 168, 34, 19, ex, { lid: skin, ...eyeOpt });
  if (nose === "button") Q(c, [144, 194], [156, 200], [150, 188], 5); else Q(c, [146, 180], [160, 200], [146, 202], 5);
  if (extra) extra(c, ex);
  mouth(c, 150, 222, ex, mouthW);
  if (front) front(c, ex);
}
const SK = { light: "#f6d2b4", fair: "#ffe0c8", tan: "#d9a77c", brown: "#a8714a", deep: "#7a4b30", olive: "#c9a07a" };
const H = {
  nico(c, ex) { humanHead(c, ex, { skin: SK.fair,
    back: (c) => { E(c, 150, 112, 92, 56, "#6b3f22", 8); },
    front: (c) => { path(c, () => { c.moveTo(66, 150); c.quadraticCurveTo(80, 70, 150, 72); c.quadraticCurveTo(222, 70, 234, 150); c.quadraticCurveTo(200, 104, 150, 112); c.quadraticCurveTo(96, 104, 66, 150); }); fillInk(c, "#7a4826", 8); Q(c, [150, 74], [168, 34], [186, 50], 9); Q(c, [150, 74], [168, 34], [186, 50], 4, "#7a4826"); },
    eyeOpt: { glasses: true } }); },
  ada(c, ex) { humanHead(c, ex, { skin: SK.deep,
    back: (c) => { for (const [x, y, r] of [[150, 70, 54], [96, 96, 40], [204, 96, 40], [76, 140, 30], [224, 140, 30]]) E(c, x, y, r, r * 0.9, "#2a1b14", 8); L(c, [[176, 40], [214, 66]], 8, "#f6c43c"); },
    front: (c) => { path(c, () => c.roundRect(82, 104, 136, 30, 14)); fillInk(c, "rgba(140,220,240,0.75)", 7); L(c, [[150, 104], [150, 134]], 5); },
    nose: "line" }); },
  gus(c, ex) { humanHead(c, ex, { skin: SK.light, mouthW: 16,
    back: (c) => { for (const s of [-1, 1]) E(c, 150 + s * 76, 150, 26, 34, "#e9e9ee", 7); },
    front: (c, ex) => { path(c, () => { c.moveTo(108, 210); c.quadraticCurveTo(150, 190, 192, 210); c.quadraticCurveTo(170, 224, 150, 214); c.quadraticCurveTo(130, 224, 108, 210); }); fillInk(c, "#f2f2f4", 6); for (const s of [-1, 1]) Q(c, [150 + s * 16, 136], [150 + s * 40, 128], [150 + s * 58, 140], 10, "#e9e9ee"); },
    extra: (c) => { L(c, [[118, 108], [132, 102]], 4, "rgba(36,23,38,0.35)"); L(c, [[168, 102], [182, 108]], 4, "rgba(36,23,38,0.35)"); } }); },
  luna(c, ex) { humanHead(c, ex, { skin: SK.olive,
    back: (c) => { E(c, 150, 120, 98, 70, "#3a2a5e", 8); path(c, () => { c.moveTo(214, 110); c.quadraticCurveTo(290, 120, 268, 220); c.quadraticCurveTo(250, 170, 222, 160); c.closePath(); }); fillInk(c, "#3a2a5e", 8); },
    front: (c) => { path(c, () => { c.moveTo(64, 160); c.quadraticCurveTo(70, 80, 160, 80); c.quadraticCurveTo(230, 84, 236, 140); c.quadraticCurveTo(170, 96, 112, 130); c.quadraticCurveTo(84, 140, 64, 160); }); fillInk(c, "#46336e", 8);
      Q(c, [62, 176], [150, 40], [238, 176], 12); for (const s of [-1, 1]) { path(c, () => c.roundRect(150 + s * 92 - 18, 150, 36, 52, 14)); fillInk(c, "#ff6a9a", 7); } } }); },
  max(c, ex) { humanHead(c, ex, { skin: SK.tan,
    front: (c) => { E(c, 150, 104, 128, 24, "#c9a46a", 8); path(c, () => { c.moveTo(80, 104); c.quadraticCurveTo(84, 40, 150, 40); c.quadraticCurveTo(216, 40, 220, 104); c.closePath(); }); fillInk(c, "#d9b77c", 8); L(c, [[84, 92], [216, 92]], 8, "#7a5a32");
      path(c, () => { c.moveTo(112, 210); c.quadraticCurveTo(150, 194, 188, 210); c.quadraticCurveTo(204, 222, 214, 206); c.quadraticCurveTo(150, 236, 86, 206); c.quadraticCurveTo(96, 222, 112, 210); }); fillInk(c, "#5a3b22", 6); },
    mouthW: 16 }); },
  sam(c, ex) { humanHead(c, ex, { skin: SK.brown,
    front: (c) => { E(c, 150, 108, 124, 20, "#3b3f52", 8); path(c, () => { c.moveTo(92, 108); c.quadraticCurveTo(92, 48, 150, 50); c.quadraticCurveTo(208, 48, 208, 108); c.closePath(); }); fillInk(c, "#4a4f66", 8); L(c, [[94, 96], [206, 96]], 10, "#d23b3b"); path(c, () => { c.moveTo(126, 60); c.quadraticCurveTo(150, 72, 174, 60); }); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); },

  pepe(c, ex) { humanHead(c, ex, { skin: SK.light, mouthW: 16,
    front: (c) => { path(c, () => c.roundRect(98, 74, 104, 40, 8)); fillInk(c, "#ffffff", 8); for (const [x, y, r] of [[116, 66, 22], [150, 58, 25], [184, 66, 22]]) E(c, x, y, r, r, "#ffffff", 8); path(c, () => c.roundRect(98, 74, 104, 40, 8)); fillInk(c, "#ffffff", 0); L(c, [[98, 96], [202, 96]], 0);

  ray(c, ex) {

      front: (c) => { path(c, () => { c.moveTo(70, 150); c.quadraticCurveTo(84, 84, 150, 84); c.quadraticCurveTo(216, 84, 230, 150); c.quadraticCurveTo(190, 112, 150, 118); c.quadraticCurveTo(110, 112, 70, 150); }); fillInk(c, "#1d1512", 7); } });
    E(c, 150, 170, 124, 118, "rgba(190,230,255,0.22)", 8); c.save(); c.globalAlpha = 0.6; Q(c, [86, 120], [110, 70], [160, 60], 8, "#ffffff"); c.restore();
    path(c, () => c.roundRect(60, 258, 180, 26, 12)); fillInk(c, "#e8622c", 8);
  },
  mia(c, ex) { humanHead(c, ex, { skin: SK.fair,
    back: (c) => { E(c, 150, 116, 96, 62, "#c4452e", 8); for (const s of [-1, 1]) { E(c, 150 + s * 96, 206, 22, 46, "#c4452e", 8); } },
    front: (c) => { path(c, () => { c.moveTo(62, 156); c.quadraticCurveTo(66, 78, 150, 78); c.quadraticCurveTo(234, 78, 238, 156); c.quadraticCurveTo(200, 110, 150, 112); c.quadraticCurveTo(100, 110, 62, 156); }); fillInk(c, "#d4553a", 8);
      path(c, () => c.roundRect(84, 96, 132, 30, 14)); fillInk(c, "#8a5a34", 7); for (const s of [-1, 1]) { E(c, 150 + s * 34, 111, 22, 16, "#ffd37a", 6); E(c, 150 + s * 34, 111, 13, 9, "#a8d8f0", 0); } } }); },
  bob(c, ex) { humanHead(c, ex, { skin: SK.tan, mouthW: 18,
    front: (c) => { path(c, () => { c.moveTo(78, 110); c.quadraticCurveTo(80, 48, 150, 46); c.quadraticCurveTo(220, 48, 222, 110); c.closePath(); }); fillInk(c, "#f6c43c", 8); path(c, () => c.roundRect(66, 102, 168, 18, 9)); fillInk(c, "#f6c43c", 8); L(c, [[150, 48], [150, 102]], 7, "#d9a42a");
      path(c, () => { c.moveTo(80, 196); c.quadraticCurveTo(94, 270, 150, 272); c.quadraticCurveTo(206, 270, 220, 196); c.quadraticCurveTo(204, 232, 150, 236); c.quadraticCurveTo(96, 232, 80, 196); }); fillInk(c, "#6b3f22", 6); } }); },
};

// ---------- the ten human hosts ----------
